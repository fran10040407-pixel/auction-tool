<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본 옥션 검색 및 계산 도구</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; font-size: 1.2em; }
        .item-row { margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .item-name { width: 120px; font-weight: bold; }
        button { padding: 8px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .search-btn { background-color: #ffe600; }
        .price-btn { background-color: #e0e0e0; }
        input[type="text"], input[type="number"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; max-width: 150px; }
        
        .calc-row { margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap;}
        .calc-row > label:first-child { display: inline-block; width: 160px; font-weight: bold; color: #444; }
        .radio-group { display: flex; align-items: center; }
        .radio-group label { width: auto; font-weight: normal; margin-right: 15px; cursor: pointer; color: #333; }
        
        #totalResult { font-size: 1.2em; color: #333; font-weight: bold; margin-top: 15px; line-height: 1.5; }
        #statusMsg { margin-top: 10px; font-size: 0.9em; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. 주류 옥션 빠른 검색</h2>
        <div class="item-row">
            <span class="item-name">맥캘란</span>
            <button class="search-btn" onclick="openYahoo('マッカラン')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('マッカラン')">시세 조회</button>
        </div>
        <div class="item-row">
            <span class="item-name">발렌타인</span>
            <button class="search-btn" onclick="openYahoo('バランタイン')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('バランタイン')">시세 조회</button>
        </div>
        <div class="item-row">
            <span class="item-name">스프링뱅크</span>
            <button class="search-btn" onclick="openYahoo('スプリングバンク')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('スプリングバンク')">시세 조회</button>
        </div>
        <div class="item-row">
            <span class="item-name">조니워커 금뚜</span>
            <button class="search-btn" onclick="openYahoo('ジョニーウォーカー 金キャップ')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('ジョニーウォーカー 金キャップ')">시세 조회</button>
        </div>
        <div class="item-row">
            <span class="item-name">조니워커 반금뚜</span>
            <button class="search-btn" onclick="openYahoo('ジョニーウォーカー 黒金キャップ')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('ジョニーウォーカー 黒金キャップ')">시세 조회</button>
        </div>
        <div class="item-row">
            <span class="item-name">캬뮤 미니북</span>
            <button class="search-btn" onclick="openYahoo('カミュ ミニブック')">옥션 검색</button>
            <button class="price-btn" onclick="openClosedYahoo('カミュ ミニブック')">시세 조회</button>
        </div>
    </div>

    <div class="container">
        <h2>2. 최고급 와인 전용 검색 (스크롤 선택)</h2>
        <div class="calc-row">
            <select id="wineSelect" style="max-width: 350px; width: 100%; padding: 8px;">
                <option value="シャトー ラフィット ロチルド">샤토 라피트 로칠드</option>
                <option value="シャトー ラトゥール">샤토 라투르</option>
                <option value="シャトー マルゴー">샤토 마고</option>
                <option value="シャトー オー ブリオン">샤토 오 브리옹</option>
                <option value="シャトー ムートン ロチルド">샤토 무통 로칠드</option>
                <option value="ドメーヌ コシュ デュリ ムルソー">도멘 코쉬 뒤리 뫼르소 (화이트의 왕)</option>
            </select>
            <button class="search-btn" onclick="searchSelectedWine()" style="margin-left: 10px;">옥션 검색</button>
            <button class="price-btn" onclick="searchSelectedWineClosed()" style="margin-left: 5px;">시세 조회</button>
        </div>
    </div>

    <div class="container">
        <h2>3. 인기 주류 판매자 바로가기</h2>
        <div class="item-row">
            <span class="item-name">가스</span>
            <button class="search-btn" onclick="window.open('https://auctions.yahoo.co.jp/seller/2QBqrSWBpztNbueEsP84NqeJwQPyb', '_blank')">판매자 보기</button>
        </div>
        <div class="item-row">
            <span class="item-name">사케</span>
            <button class="search-btn" onclick="window.open('https://auctions.yahoo.co.jp/seller/Byc6VqiSUc4XGupSvRudkfQSxxSHb', '_blank')">판매자 보기</button>
        </div>
        <div class="item-row">
            <span class="item-name">자오</span>
            <button class="search-btn" onclick="window.open('https://auctions.yahoo.co.jp/seller/9Tcw4zTn9fWDQtZfsXfdrwyavNuKA', '_blank')">판매자 보기</button>
        </div>
        <div class="item-row">
            <span class="item-name">조이</span>
            <button class="search-btn" onclick="window.open('https://auctions.yahoo.co.jp/seller/ex52Sva44S6Wuj9yB4CLudswCEHx', '_blank')">판매자 보기</button>
        </div>
    </div>

    <div class="container">
        <h2>4. 자동 번역 검색</h2>
        <input type="text" id="koreanKeyword" placeholder="아무 한글이나 입력하세요">
        <button class="search-btn" onclick="searchCustom()" style="margin-top:5px;">번역 후 야후 검색</button>
        <div id="statusMsg"></div>
    </div>

    <div class="container">
        <h2>5. 주류 직구 예상 총비용 계산기</h2>
        <div class="calc-row">
            <label>결제 화폐:</label>
            <div class="radio-group">
                <label><input type="radio" name="currency" value="JPY" checked onchange="changeCurrency()"> 엔화 (JPY)</label>
                <label><input type="radio" name="currency" value="USD" onchange="changeCurrency()"> 달러 (USD)</label>
            </div>
        </div>
        <div class="calc-row">
            <label>총 구입가 (모든 병 합산):</label>
            <input type="number" id="bidPrice" value="10000"> <span id="bidUnit" style="margin-left: 5px;">엔</span>
        </div>
        <div class="calc-row" style="align-items: flex-start;">
            <label style="margin-top: 8px;">현재 환율:</label>
            <div style="display: flex; flex-direction: column;">
                <div>
                    <input type="number" id="exchangeRate" value="900" step="0.01"> <span id="rateUnit" style="margin-left: 5px;">원 (100엔당)</span>
                </div>
                <div id="rateStatus" style="font-size: 0.85em; color: #0066cc; margin-top: 5px;">(실시간 환율 로딩 중...)</div>
            </div>
        </div>
        <div class="calc-row">
            <label>현지+국제 배송:</label>
            <input type="number" id="shippingFee" value="3000"> <span id="shipUnit" style="margin-left: 5px;">엔</span>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <div class="calc-row">
            <label>1병당 용량(L):</label>
            <input type="number" id="volumeL" value="0.7" step="0.1" style="max-width: 80px;"> <span style="margin-left: 5px; font-size:0.9em; color:#555;">L (예: 700ml = 0.7)</span>
        </div>
        <div class="calc-row">
            <label>총 병수:</label>
            <input type="number" id="bottleCount" value="1" style="max-width: 80px;"> <span style="margin-left: 5px;">병</span>
        </div>
        <div class="calc-row">
            <label>정밀 주종 선택:</label>
            <select id="liquorType" style="max-width: 320px; width: 100%;">
                <option value="whisky">위스키 / 꼬냑 / 브랜디</option>
                <option value="wine">와인 / 과실주 (교육세 10%)</option>
                <option value="sake">사케 / 청주 (교육세 면제)</option>
                <option value="soju">소주 / 고량주 / 보드카</option>
                <option value="beer">맥주 (종량세 적용)</option>
                <option value="none">세금 전액 면제 (0%)</option>
            </select>
        </div>
        
        <button class="search-btn" onclick="calculateTotal()" style="margin-top:10px; width: 140px;">총 예상비용 계산</button>
        <div id="totalResult">총 예상 비용: </div>
        <p style="font-size: 0.85em; color: #666; margin-top: 10px;">※ 위스키, 사케 등은 총 가격에 비례하여 세금이 매겨지므로, 합산 구입가가 같다면 병수가 늘어나도 세금 액수는 동일합니다.</p>
    </div>

    <script>
        var userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.indexOf("kakaotalk") > -1) {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
        }

        function openYahoo(keyword) {
            const url = `https://auctions.yahoo.co.jp/search/search?p=${encodeURIComponent(keyword)}&s1=end&o1=a&auccat=2084006720`;
            window.open(url, '_blank');
        }
        
        function openClosedYahoo(keyword) {
            const url = `https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${encodeURIComponent(keyword)}&auccat=2084006720`;
            window.open(url, '_blank');
        }
        
        function searchSelectedWine() {
            const keyword = document.getElementById('wineSelect').value;
            openYahoo(keyword);
        }
        
        function searchSelectedWineClosed() {
            const keyword = document.getElementById('wineSelect').value;
            openClosedYahoo(keyword);
        }
        
        const dic = {
            "야마자키": "山崎", "히비키": "響", "하쿠슈": "白州", "요이치": "余市", "미야기쿄": "宮城峡", "타케츠루": "竹鶴", "이치로즈몰트": "イチローズモルト",
            "맥캘란": "マッカラン", "글렌피딕": "グレンフィディック", "글렌리벳": "グレンリベット", "글렌모렌지": "グレンモーレンジ", "글렌드로나흐": "グレンドロナック", "글렌파클라스": "グレンファークラス", "발베니": "バルベニー", "달모어": "ダルモア", "클라이넬리쉬": "クライヌリッシュ", "오반": "オーバン", "벤리악": "ベンリアック", "아벨라워": "アベラワー", "크라간모어": "クラガンモア",
            "아드벡": "アードベッグ", "라프로익": "ラフロイグ", "보모어": "ボウ মোহ", "라가불린": "ラガヴーリン", "쿨릴라": "カリラ", "브룩라디": "ブルックラディ", "부나하벤": "ブナハーブン", "킬호만": "キルホーマン", "탈리스커": "タリスカー", "하이랜드파크": "ハイランドパーク", "아란": "アラン", "스프링뱅크": "スプリングバンク", "롱로우": "ロングロウ", "헤이즐번": "ヘーゼルバーン",
            "발렌타인": "バランタイン", "조니워커": "ジョニーウォーカー", "로얄살루트": "ロイヤルサルート", "시바스리갈": "シーバスリーガル", "올드파": "オールドパー", "듀어스": "デュワーズ", "커티삭": "カティサーク", "딤플": "ディンプル",
            "제임슨": "ジェムソン", "부쉬밀": "ブッシュミルズ", "레드브레스트": "レッドブレスト",
            "와일드터키": "ワイルドターキー", "버팔로트레이스": "バッファロートレース", "메이커스마크": "メーカーズマーク", "우드포드리저브": "ウッドフォードリザーブ", "잭다니엘": "ジャックダニエル",
            "헤네시": "ヘネシー", "레미마틴": "レミーマルタン", "카뮤": "カミュ", "조세핀": "ジョセフィン",
            "사케": "日本酒", "와인": "ワイン", "닷사이": "獺祭", "쥬욘다이": "十四代", "돔페리뇽": "ドンペリニヨン"
        };
        
        async function searchCustom() {
            let input = document.getElementById('koreanKeyword').value.trim();
            let status = document.getElementById('statusMsg');
            
            if (!input) { alert("검색어를 입력하세요."); return; }
            
            let normalizedInput = input.replace(/\s+/g, '');
            let jpKeyword = input;
            
            if (dic[normalizedInput]) {
                jpKeyword = dic[normalizedInput];
                status.style.color = "#0066cc";
                status.innerText = `✅ 내장 사전 작동: [${jpKeyword}] (으)로 검색합니다.`;
                setTimeout(() => openYahoo(jpKeyword), 400); 
            } else {
                status.style.color = "#ff8c00";
                status.innerText = "⏳ 구글 번역 서버와 통신 중...";
                try {
                    const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=ja&dt=t&q=${encodeURIComponent(input)}`);
                    const data = await response.json();
                    jpKeyword = data[0][0][0]; 
                    
                    if (!/^[a-zA-Z0-9\s]+$/.test(jpKeyword)) {
                        status.style.color = "#008000";
                        status.innerText = `✅ 구글 번역 성공: [${jpKeyword}] (으)로 검색합니다.`;
                    } else {
                        status.style.color = "red";
                        status.innerText = `⚠️ 구글이 영문 [${jpKeyword}](으)로 번역했습니다. 매물이 없을 수 있습니다.`;
                    }
                    setTimeout(() => openYahoo(jpKeyword), 600);
                    
                } catch (error) {
                    status.style.color = "red";
                    status.innerText = "❌ 차단되어 번역에 실패했습니다. 한글 그대로 검색합니다.";
                    setTimeout(() => openYahoo(input), 1500);
                }
            }
        }

        let apiRates = { JPY_per_USD: 150, KRW_per_USD: 1350 };
        
        async function fetchRates() {
            try {
                let res = await fetch('https://open.er-api.com/v6/latest/USD');
                let data = await res.json();
                apiRates.JPY_per_USD = data.rates.JPY;
                apiRates.KRW_per_USD = data.rates.KRW;
                
                document.getElementById('rateStatus').innerText = "✅ 오늘 기준 실시간 환율이 자동 적용되었습니다.";
                document.getElementById('rateStatus').style.color = "#008000";
                changeCurrency();
            } catch (e) {
                document.getElementById('rateStatus').innerText = "⚠️ 실시간 환율을 불러오지 못했습니다. 수동으로 입력해 주세요.";
                document.getElementById('rateStatus').style.color = "red";
            }
        }
        
        window.onload = fetchRates;

        function changeCurrency() {
            const curr = document.querySelector('input[name="currency"]:checked').value;
            const bidInput = document.getElementById('bidPrice');
            const rateInput = document.getElementById('exchangeRate');
            const shipInput = document.getElementById('shippingFee');
            
            if (curr === 'JPY') {
                document.getElementById('bidUnit').innerText = '엔';
                document.getElementById('rateUnit').innerText = '원 (100엔당)';
                document.getElementById('shipUnit').innerText = '엔';
                
                const jpyKrwRate = (apiRates.KRW_per_USD / apiRates.JPY_per_USD) * 100;
                rateInput.value = jpyKrwRate.toFixed(2);
                
                if (bidInput.value == 100) bidInput.value = 10000;
                if (shipInput.value == 25) shipInput.value = 3000;
            } else {
                document.getElementById('bidUnit').innerText = '달러';
                document.getElementById('rateUnit').innerText = '원 (1달러당)';
                document.getElementById('shipUnit').innerText = '달러';
                
                rateInput.value = apiRates.KRW_per_USD.toFixed(2);
                
                if (bidInput.value == 10000) bidInput.value = 100;
                if (shipInput.value == 3000) shipInput.value = 25;
            }
        }
        
        function calculateTotal() {
            const curr = document.querySelector('input[name="currency"]:checked').value;
            const bid = parseFloat(document.getElementById('bidPrice').value) || 0;
            let rateVal = parseFloat(document.getElementById('exchangeRate').value) || 0;
            const shipping = parseFloat(document.getElementById('shippingFee').value) || 0;
            
            const volumePerBottle = parseFloat(document.getElementById('volumeL').value) || 0;
            const bottleCount = parseInt(document.getElementById('bottleCount').value) || 1;
            const liquorType = document.getElementById('liquorType').value;
            
            const totalVolumeL = volumePerBottle * bottleCount;
            
            // 면세 조건 검사
            let itemUsd = curr === 'JPY' ? bid / apiRates.JPY_per_USD : bid;
            const isDutyFree = (itemUsd <= 150) && (totalVolumeL <= 1.0) && (bottleCount === 1);
            
            const rate = curr === 'JPY' ? (rateVal / 100) : rateVal;
            const totalForeign = bid + shipping;
            const totalKrw = totalForeign * rate; 
            
            let dutyRate = 0, liquorRate = 0, eduRate = 0, vatRate = 0.10;
            let isBeer = false;
            
            if (liquorType === 'whisky') { dutyRate = 0.20; liquorRate = 0.72; eduRate = 0.30; }
            else if (liquorType === 'wine') { dutyRate = 0.15; liquorRate = 0.30; eduRate = 0.10; }
            else if (liquorType === 'sake') { dutyRate = 0.15; liquorRate = 0.30; eduRate = 0.00; }
            else if (liquorType === 'soju') { dutyRate = 0.30; liquorRate = 0.72; eduRate = 0.30; }
            else if (liquorType === 'beer') { dutyRate = 0.30; isBeer = true; } 
            
            if (isDutyFree && liquorType !== 'none') {
                dutyRate = 0; 
                vatRate = 0;  
            }
            if (liquorType === 'none') {
                dutyRate = 0; liquorRate = 0; eduRate = 0; vatRate = 0;
            }
            
            let customsTax = totalKrw * dutyRate;
            let liquorTax = 0;
            let eduTax = 0;
            
            if (liquorType !== 'none') {
                if (isBeer) {
                    liquorTax = totalVolumeL * 885.7; 
                    eduTax = liquorTax * 0.30;
                } else {
                    liquorTax = (totalKrw + customsTax) * liquorRate; 
                    eduTax = liquorTax * eduRate;
                }
            }
            
            let vatTax = (totalKrw + customsTax + liquorTax + eduTax) * vatRate;
            
            const totalTaxAmountKrw = customsTax + liquorTax + eduTax + vatTax;
            const finalKrw = totalKrw + totalTaxAmountKrw;
            
            let taxMsg = isDutyFree ? 
                `<span style="color:#008000; font-weight:bold;">[소액 면세 적용 - 관세/부가세 면제]</span>` : 
                `<span style="color:#d32f2f; font-weight:bold;">[면세 조건 초과 - 풀세금 부과됨]</span>`;
            
            if (liquorType === 'none') taxMsg = `<span style="color:#008000; font-weight:bold;">[세금 전액 면제]</span>`;
            
            document.getElementById('totalResult').innerHTML = 
                `총 예상 비용: <span style="color:#d32f2f;">약 ${Math.round(finalKrw).toLocaleString()} 원</span><br>` + 
                `<span style="font-size: 0.9em; margin-top: 5px; display: block;">${taxMsg}</span>` +
                `<span style="font-size: 0.85em; color: #555;">(상품+배송: ${Math.round(totalKrw).toLocaleString()}원 / 세금: ${Math.round(totalTaxAmountKrw).toLocaleString()}원)</span>`;
        }
    </script>
</body>
</html>
